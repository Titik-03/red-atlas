# RED ATLAS terrain pipeline configuration.
# Every "expected" value below was transcribed from the official product documentation
# (USGS FGDC metadata XML + ISIS/PDS3 labels) - see docs/DATA_SOURCES.md for citations.
# build_terrain.py aborts if the live product headers disagree with these values.

site:
  id: jezero
  name: "Jezero Crater - western delta front"
  # Tile centre (planetocentric latitude, east-positive longitude, degrees).
  # Chosen so the tile covers the delta front scarp and the Perseverance landing point.
  center_lat: 18.455
  center_lon: 77.425
  size_m: 4096          # square tile edge, ground metres
  dem_res_m: 2.0        # output heightmap grid spacing
  tex_res_m: 1.0        # output texture pixel size

body:
  name: Mars
  radius_m: 3396190.0   # Mars 2000 IAU sphere (all TRN labels: EquatorialRadius = PolarRadius = 3396190.0)

products:
  dtm:
    id: JEZ_hirise_soc_006_DTM_MOLAtopography_DeltaGeoid_1m_Eqc_latTs0_lon0_blend40
    title: "HiRISE Digital Terrain Model Mosaic for Mars 2020 Terrain Relative Navigation"
    mission: "Mars Reconnaissance Orbiter"
    instrument: "HiRISE"
    doi: "10.5066/P9REJ9JN"
    url: "https://asc-pds-services.s3.us-west-2.amazonaws.com/mosaic/mars2020_trn/HiRISE/JEZ_hirise_soc_006_DTM_MOLAtopography_DeltaGeoid_1m_Eqc_latTs0_lon0_blend40.tif"
    expected:
      proj_contains: ["+proj=eqc", "+lat_ts=0", "+lon_0=0", "+R=3396190"]
      pixel_size_m: 1.0
      width: 21400
      height: 21488
      dtype: float32
      nodata: -3.4028226550889045e+38
      valid_min: -2659.776611328125     # FGDC metadata Range_Domain_Minimum
      valid_max: -1942.1046142578125    # FGDC metadata Range_Domain_Maximum
    units: "m"
    # Resolved 2026-11-14 with NASA data: at 261 Mars 2020 rover waypoints inside the tile (NASA MMGIS
    # M20_waypoints.json), this DTM equals NASA's "elev_geoid" (median diff 0.00 m, sd 0.08 m), whereas
    # NASA's sphere-relative "elev_radii" is ~1.7 km lower. Heights are therefore relative to the Mars areoid.
    vertical_reference: "Metres relative to the Mars areoid (MOLA topography convention), consistent with NASA Mars 2020 waypoint elev_geoid to 0.1 m; horizontal frame: Mars 2000 IAU sphere, R = 3,396,190 m"
  ortho:
    id: JEZ_hirise_soc_006_orthoMosaic_25cm_Eqc_latTs0_lon0_first
    title: "HiRISE Orthorectified Image Mosaic for Mars 2020 Terrain Relative Navigation"
    mission: "Mars Reconnaissance Orbiter"
    instrument: "HiRISE"
    doi: "10.5066/P9QJDP48"
    url: "https://asc-pds-services.s3.us-west-2.amazonaws.com/mosaic/mars2020_trn/HiRISE/JEZ_hirise_soc_006_orthoMosaic_25cm_Eqc_latTs0_lon0_first.tif"
    expected:
      proj_contains: ["+proj=eqc", "+lat_ts=0", "+lon_0=0", "+R=3396190"]
      pixel_size_m: 0.25
      width: 85600
      height: 85952
      dtype: uint8
      nodata: 0.0

validation:
  n_check_points: 25
  # Output heights are area-averaged (1 m -> 2 m); compare against the source with
  # a tolerance proportional to the resampling, and report the statistics.
  max_median_abs_diff_m: 0.25
  max_p95_abs_diff_m: 1.0

# ---------------------------------------------------------------------------------------------
# "global" profile: on-demand sites anywhere on Mars (pipeline/site_server.py, build_terrain.py --lat/--lon).
# Facts verified 2026-11-14 from the live labels/headers (see docs/DATA_SOURCES.md):
global:
  dem:
    id: Mars_HRSC_MOLA_BlendDEM_Global_200mp_v2
    title: "Mars MGS MOLA - MEX HRSC Blended DEM Global 200m v2"
    mission: "Mars Global Surveyor + Mars Express"
    instrument: "MOLA + HRSC"
    citation: "Fergason, Hare & Laura (2018), USGS Astrogeology PDS Annex"
    doi: null
    info: "https://astrogeology.usgs.gov/search/map/mars_mgs_mola_mex_hrsc_blended_dem_global_200m"
    url: "https://asc-pds-services.s3.us-west-2.amazonaws.com/mosaic/Mars/HRSC_MOLA_Blend/Mars_HRSC_MOLA_BlendDEM_Global_200mp_v2.tif"
    expected:
      # ISIS label: SimpleCylindrical, R = 3396190 m, 296.3735 px/deg, 106694 x 53347, SignedWord LSB.
      # The GeoTIFF itself is georeferenced in degrees (+proj=longlat), origin (-180, 90).
      proj_contains: ["+proj=longlat", "+R=3396190"]
      pixel_size_deg: 0.0033741208306410663   # 1 / 296.3735 (label Scale)
      origin_deg: [-180.0, 90.0]
      width: 106694
      height: 53347
      dtype: int16
      nodata: -32768.0                        # .lbl.aux.xml NoDataValue
      valid_min: -8528                        # .tif.aux.xml STATISTICS_MINIMUM
      valid_max: 21226                        # .tif.aux.xml STATISTICS_MAXIMUM
      core_start_byte: 854273                 # ISIS label Core StartByte (1-based) = PDS3 ^IMAGE offset
    native_m: 200.0                           # label PixelResolution 199.99999 m; MOLA input 463 m, HRSC ~50 m
    units: "m"
    # The FGDC <vertdef> is empty. The metadata Logical Consistency section cites the areoid error budget,
    # and our check of 20 km box means at 7 sites against MOLA MEGDR (areoid-relative) gives |diff| < 20 m
    # (excluding the Olympus summit slope). Each site re-checks this against MEGDR.
    vertical_reference: "Metres relative to the Mars areoid (MOLA convention; checked per site against MOLA MEGDR); horizontal frame: Mars 2000 IAU sphere, R = 3,396,190 m"
  image:
    id: CTX_beta01_uncontrolled_5m_Caltech
    title: "MRO CTX global mosaic beta01 (uncontrolled), Caltech Murray Lab"
    mission: "Mars Reconnaissance Orbiter"
    instrument: "CTX"
    citation: "Data credit: NASA/JPL/MSSS/The Murray Lab (service description); hosted by Esri"
    doi: null
    info: "https://trek.nasa.gov/tiles/Mars/EQ/CTX_beta01_uncontrolled_5m_Caltech/1.0.0/WMTSCapabilities.xml"
    # Tile URL template from the WMTS ResourceURL; geometry from the ArcGIS service JSON (?f=json).
    # NOTE: the Trek capabilities list 256 px tiles; the service JSON and live tiles are 512 px (used here).
    url: "https://astro.arcgis.com/arcgis/rest/services/OnMars/CTX/MapServer/tile/{z}/{row}/{col}"
    service_json: "https://astro.arcgis.com/arcgis/rest/services/OnMars/CTX/MapServer?f=json"
    expected:
      wkt_contains: ["GCS_Mars_2000_Sphere", "3396190.0"]
      origin_deg: [-180.0, 90.0]
      tile_px: 512
      max_level: 12                            # level 13 returns HTTP 400
      level_res_deg: 0.0000858306884765625     # level 12 lods.resolution (= 0.3515625 / 2^12)
    native_m: 5.088                            # level-12 pixel at the equator (CTX nominal ~5-6 m/px)
    max_tiles: 220                             # coarser level used above this (high latitudes / 40 km tiles)
    min_level: 9                               # coarsest fallback (~41 m/px) where the level-12 cache has holes
    nodata: 0                                  # 404 tiles (no coverage) -> 0
    bands: "CTX panchromatic (grayscale, 8-bit lossy JPEG in the service)"
  megdr:
    file: "data/raw/globe/megt90n000fb.img"   # PDS MGS MOLA MEGDR, 32 ppd, >i2, 90N..90S, 0..360E
    ppd: 32
  sizes_km: [10, 20, 40]
  context:                                     # low-res surroundings drawn around every site (orientation only)
    global_edge_m: 160000                      # "Land here" sites: ONE fixed surroundings square for every size,
                                               # so the 10/20/40 km high-resolution square visibly changes inside it
    factor: 8                                  # HiRISE tile: context edge = 8 x site edge, clamped below
    min_m: 64000                               # Jezero 4 km tile -> 64 km (whole Jezero crater, ~45 km)
    max_m: 320000
    heightmap_px: 256
    texture_px: 2048
    max_tiles: 100
    min_level: 6                               # ~330 m/px floor for the surroundings
  heightmap_px: 1024
  texture_max_px: 4096
  max_abs_lat: 80
  validation:
    megdr_max_mean_diff_m: 100
    registration_search_m: 600
    registration_grid_m: 50
    registration_pass_m: 200                   # one native DEM pixel
    registration_min_r2: 0.05
    texture_gap_warn: 0.001
    # (no gap failure any more: holes are filled from coarser CTX levels, then DEM shaded relief, and reported)
    tile_min_r: 0.5                            # fine CTX tile vs 4x-coarser overview, Pearson r
