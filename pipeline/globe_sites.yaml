# Landed NASA missions - values transcribed verbatim from the NASA PDS Geosciences Node
# Orbital Data Explorer "Existing Landing Sites" page:
#   https://ode.rsl.wustl.edu/mars/pagehelp/Content/Missions_Instruments/Landing_Sites.htm
# Longitudes are degrees East (0-360) as printed; the page cites the primary reference for each site.
# Perseverance is added by build_globe.py from NASA's Mars 2020 MMGIS waypoint layer.
# InSight is intentionally omitted until an official NASA/PDS coordinate source is transcribed.
landers:
